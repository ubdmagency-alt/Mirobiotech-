name = "mirobiotech"
compatibility_date = "2025-01-01"
workers_dev = true

# Static assets are served straight from ./public — no worker script needed.
[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Custom domain (optional). Uncomment once the zone is on your Cloudflare
# account and the DNS record is proxied.
# [[routes]]
# pattern = "mirobiotech.com"
# custom_domain = true
